# External keep-alive: pings the Render service so a FREE instance never idles
# into a spin-down. This is the RELIABLE half — it runs on GitHub's servers, so
# it can wake the service even after it has gone to sleep (unlike the in-process
# self-ping).
#
# Setup (one time):
#   Repo → Settings → Secrets and variables → Actions → Variables →
#     New variable:  HEALTHCHECK_URL = https://<your-service>.onrender.com/api/health
#
# Note: GitHub cron is best-effort and can lag a few minutes under load; the 5m
# schedule plus Render's 15m idle window leaves comfortable margin. You can also
# use cron-job.org or UptimeRobot instead of (or alongside) this.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (well inside Render's 15m idle window)
  workflow_dispatch: {}        # allow manual runs
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.HEALTHCHECK_URL }}"
          if [ -z "$URL" ]; then
            echo "Set the HEALTHCHECK_URL repo variable to your Render /api/health URL."
            exit 1
          fi
          echo "Pinging $URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo 000)
          echo "HTTP $code"
          # Don't fail the job on a cold-start blip; a wake takes a few seconds.
          if [ "$code" = "000" ]; then echo "no response (service may be waking)"; fi
